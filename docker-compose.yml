version: '3.8'

services:
  backend:
    build: 
      context: ./backend
    container_name: osint_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - APP_NAME=OSINT Security Crawler
      - DEBUG_MODE=True
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173