services:
  backend:
    build: 
      context: ./backend
    container_name: osint_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/data
      - ./logs:/logs
    environment:
      - DATABASE_URL=sqlite:////data/osint_crawler.db
      - LOG_DIR=/logs
    env_file:
      - ./backend/.env

  frontend:
    build:
      context: ./frontend
    container_name: osint_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend