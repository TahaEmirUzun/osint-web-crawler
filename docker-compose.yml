services:
  backend:
    build: 
      context: ./backend
    container_name: osint_backend
    ports:
      - "8000:8000"
    volumes:
      # Geliştirme için backend kodları
      - ./backend:/app
      # Veritabanının kalıcı olacağı data klasörü
      - ./data:/app/data
      # Logların tutulacağı klasör
      - ./logs:/app/logs
    # En yüksek öncelikli ayarlar burasıdır, kodu buraya bakmaya zorlarız
    environment:
      - DATABASE_URL=sqlite:////app/data/osint_crawler.db
    # Ortam değişkenlerini doğrudan .env dosyasından çekiyoruz
    env_file:
      - ./backend/.env